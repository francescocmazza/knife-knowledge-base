site_name: Xinzuo Knowledge Base
site_description: Xinzuo's multilingual guide to kitchen knives, blade steels, handle materials, construction, sharpening, maintenance, safety, and product knowledge.
site_author: Xinzuo
site_url: https://francescocmazza.github.io/knife-knowledge-base/

repo_name: francescocmazza/knife-knowledge-base
repo_url: https://github.com/francescocmazza/knife-knowledge-base
edit_uri: edit/main/content/en/

copyright: Copyright &copy; 2026 Xinzuo — written content CC BY-NC-SA 4.0 unless otherwise stated

docs_dir: content/en
site_dir: site
use_directory_urls: true
exclude_docs: |
  README.md
  assets/IMAGE_RIGHTS.md

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view

plugins:
  - search

markdown_extensions:
  - meta
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/learning-figures.css
  - assets/stylesheets/visual-corrections.css

extra_javascript:
  - assets/javascripts/learning-figures.js
  - assets/javascripts/visual-corrections.js

nav:
  - Xinzuo Knowledge Base: index.md
  - How Knives Cut:
      - Single and Double Bevels: 04-geometry-and-bevels/single-and-double-bevels.md
      - Knife Types and Cutting Styles: 05-knife-types/overview.md
  - Materials and Performance:
      - The Five Dimensions of Knife Steel: 01-foundations/five-dimensions-of-knife-steel.md
      - Xinzuo Blade Steels: 02-steels-and-metallurgy/xinzuo-blade-steels.md
      - Alloying Elements: 02-steels-and-metallurgy/alloying-elements.md
      - Xinzuo Handle Materials: 02-steels-and-metallurgy/xinzuo-handle-materials.md
      - Damascus Steel: 03-blade-construction/damascus-steel.md
      - Self-Sharpening Full Damascus: 03-blade-construction/self-sharpening-full-damascus.md
  - Use and Safety:
      - Safe Use and Carrying: 08-use-and-safety/safe-use-and-carrying.md
  - Sharpening:
      - Preparing Water Stones: 10-sharpening/whetstone-preparation.md
      - Understanding the Burr: 10-sharpening/the-burr.md
      - A Practical Sharpening Process: 10-sharpening/basic-sharpening-process.md
