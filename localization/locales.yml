    status: automatic
    direction: rtl
    deploy: true
    mkdocs_language: ar
  he:
    name: עברית
    status: automatic
    direction: rtl
    deploy: true
    mkdocs_language: he

export_formats:
  - markdown
  - html
  - pdf
  - docx

rules:
  - English is the sole source of truth.
  - Meaning changes must be made in English first.
  - Every deployed translation is regenerated when its English source hash changes.
  - Generated translations are cached between deployments to avoid unnecessary model calls.
  - Every machine-translated page displays a visible review notice.
  - Japanese and Chinese exports require terminology review.
  - CJK PDF exports require fonts with full Unicode coverage.
  - Right-to-left exports require bidirectional layout support.
