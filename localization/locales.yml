source_locale: en
locale_standard: BCP-47
translation_engine: GitHub Models
translation_policy: machine-generated translations are derived from and never replace the English source of truth

locales:
  en:
    name: English
    status: source
    direction: ltr
    deploy: true
    mkdocs_language: en
  it:
