<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Self-sharpening effect in full Damascus blades</title><desc id="desc">A simplified comparison between the initial layered edge and the micro-serrated edge that remains after layers wear at slightly different rates.</desc><style>text{font-family:Arial,sans-serif;fill:#222}.title{font-size:34px;font-weight:bold}.label{font-size:27px;font-weight:bold}.small{font-size:22px}</style><rect width="100%" height="100%" fill="#fffaf5"/><text x="40" y="50" class="title">Self-sharpening effect in full Damascus blades</text><text x="40" y="84" class="small">Simplified concept: alternating layers wear at slightly different rates</text><g transform="translate(70,145)"><text x="60" y="-18" class="label">Initial layered structure</text><rect x="0" y="0" width="360" height="180" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/><path d="M0 20 H360 M0 50 H360 M0 80 H360 M0 110 H360 M0 140 H360" stroke="#9ca3af" stroke-width="10"/><path d="M0 35 H360 M0 65 H360 M0 95 H360 M0 125 H360 M0 155 H360" stroke="#6b7280" stroke-width="10"/><path d="M40 180 L180 320 L320 180" fill="#d1d5db" stroke="#6b7280" stroke-width="3"/><text x="32" y="355" class="small">Harder and softer layers meet at the edge</text></g><g transform="translate(520,145)"><text x="35" y="-18" class="label">After use: micro-serration remains active</text><rect x="0" y="0" width="360" height="180" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/><path d="M0 20 H360 M0 50 H360 M0 80 H360 M0 110 H360 M0 140 H360" stroke="#9ca3af" stroke-width="10"/><path d="M0 35 H360 M0 65 H360 M0 95 H360 M0 125 H360 M0 155 H360" stroke="#6b7280" stroke-width="10"/><path d="M40 180 Q75 220 105 180 T170 180 T235 180 T300 180" fill="none" stroke="#b45309" stroke-width="16" stroke-linecap="round"/><text x="8" y="355" class="small">The knife still needs sharpening eventually</text></g></svg>