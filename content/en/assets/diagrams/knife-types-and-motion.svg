<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Knife profiles and common cutting motions</title><desc id="desc">Simplified silhouettes of Gyuto, Santoku, Bunka and Nakiri with arrows indicating typical rocking, push-cutting and chopping motions.</desc><style>text{font-family:Arial,sans-serif;fill:#222}.title{font-size:34px;font-weight:bold}.label{font-size:25px;font-weight:bold}.small{font-size:20px}</style><rect width="100%" height="100%" fill="#fafafa"/><text x="40" y="52" class="title">Blade profile influences the most natural cutting motion</text><g transform="translate(45,110)"><rect width="205" height="390" rx="14" fill="#fff" stroke="#d1d5db"/><text x="68" y="38" class="label">Gyuto</text><path d="M30 140 Q115 80 175 130 L175 165 Q90 185 30 165Z" fill="#cbd5e1" stroke="#475569" stroke-width="3"/><path d="M40 235 Q100 185 165 225" fill="none" stroke="#2563eb" stroke-width="6"/><polygon points="165,225 142,215 150,240" fill="#2563eb"/><text x="43" y="285" class="small">Often supports rocking</text><text x="55" y="312" class="small">when the belly is curved</text></g><g transform="translate(275,110)"><rect width="205" height="390" rx="14" fill="#fff" stroke="#d1d5db"/><text x="55" y="38" class="label">Santoku</text><path d="M30 118 Q120 86 175 126 L165 165 Q90 180 30 165Z" fill="#cbd5e1" stroke="#475569" stroke-width="3"/><line x1="55" y1="215" x2="150" y2="215" stroke="#16a34a" stroke-width="6"/><polygon points="150,215 126,202 126,228" fill="#16a34a"/><text x="45" y="285" class="small">Natural for push cuts</text><text x="42" y="312" class="small">and moderate rocking</text></g><g transform="translate(505,110)"><rect width="205" height="390" rx="14" fill="#fff" stroke="#d1d5db"/><text x="68" y="38" class="label">Bunka</text><path d="M30 125 L155 95 L178 126 L165 165 L30 165Z" fill="#cbd5e1" stroke="#475569" stroke-width="3"/><line x1="100" y1="200" x2="100" y2="255" stroke="#f59e0b" stroke-width="6"/><polygon points="100,255 87,230 113,230" fill="#f59e0b"/><text x="45" y="285" class="small">Push, chop and precise</text><text x="54" y="312" class="small">tip work; limited rocking</text></g><g transform="translate(735,110)"><rect width="180" height="390" rx="14" fill="#fff" stroke="#d1d5db"/><text x="53" y="38" class="label">Nakiri</text><path d="M22 105 H155 V165 H22Z" fill="#cbd5e1" stroke="#475569" stroke-width="3"/><line x1="90" y1="200" x2="90" y2="255" stroke="#dc2626" stroke-width="6"/><polygon points="90,255 77,230 103,230" fill="#dc2626"/><text x="37" y="285" class="small">Vertical chopping and</text><text x="42" y="312" class="small">push cutting vegetables</text></g><rect x="60" y="535" width="840" height="50" rx="10" fill="#fff" stroke="#d1d5db"/><text x="80" y="568" class="small">These are practical tendencies, not rigid rules: individual profile, edge curve and technique still matter.</text></svg>