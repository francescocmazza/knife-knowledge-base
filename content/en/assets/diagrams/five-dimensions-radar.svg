<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">The five dimensions of knife steel</title><desc id="desc">A five-axis educational radar chart showing hardness, ease of sharpening, corrosion resistance, robustness and microstructural fineness.</desc>
<style>text{font-family:Arial,sans-serif;fill:#222}.title{font-size:34px;font-weight:bold}.small{font-size:22px}.axis{font-size:24px;font-weight:bold}</style>
<rect width="100%" height="100%" fill="#f8fafc"/><text x="40" y="50" class="title">The five dimensions used in this knowledge base</text>
<g transform="translate(480,320)"><polygon points="0,-170 162,-53 100,138 -100,138 -162,-53" fill="none" stroke="#cbd5e1" stroke-width="3"/><polygon points="0,-128 122,-40 75,104 -75,104 -122,-40" fill="none" stroke="#cbd5e1" stroke-width="2"/><polygon points="0,-85 81,-27 50,70 -50,70 -81,-27" fill="none" stroke="#cbd5e1" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="-170" stroke="#94a3b8" stroke-width="2"/><line x1="0" y1="0" x2="162" y2="-53" stroke="#94a3b8" stroke-width="2"/><line x1="0" y1="0" x2="100" y2="138" stroke="#94a3b8" stroke-width="2"/><line x1="0" y1="0" x2="-100" y2="138" stroke="#94a3b8" stroke-width="2"/><line x1="0" y1="0" x2="-162" y2="-53" stroke="#94a3b8" stroke-width="2"/><polygon points="0,-120 115,-28 68,84 -48,110 -95,-20" fill="#3b82f6" fill-opacity=".28" stroke="#2563eb" stroke-width="4"/></g>
<text x="455" y="112" class="axis">Hardness</text><text x="675" y="265" class="axis">Ease of sharpening</text><text x="580" y="495" class="axis">Corrosion resistance</text><text x="220" y="495" class="axis">Robustness</text><text x="130" y="265" class="axis">Microstructural fineness</text><text x="40" y="585" class="small">Educational map only: an absolute score requires a consistent test method for every axis.</text></svg>