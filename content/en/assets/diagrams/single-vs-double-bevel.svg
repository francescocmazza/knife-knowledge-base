<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Single and double bevel comparison</title><desc id="desc">Simplified cross sections comparing a double bevel edge with a single bevel edge.</desc><style>text{font-family:Arial,sans-serif;fill:#222}.title{font-size:34px;font-weight:bold}.label{font-size:28px;font-weight:bold}.small{font-size:22px}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="40" y="50" class="title">Single bevel and double bevel: a simple visual comparison</text><g transform="translate(120,120)"><text x="110" y="-20" class="label">Double bevel</text><polygon points="150,260 250,40 350,260" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/><line x1="190" y1="180" x2="250" y2="50" stroke="#1d4ed8" stroke-width="5"/><line x1="310" y1="180" x2="250" y2="50" stroke="#1d4ed8" stroke-width="5"/><text x="94" y="305" class="small">Both sides are ground to meet at the edge</text></g><g transform="translate(520,120)"><text x="130" y="-20" class="label">Single bevel</text><path d="M180 260 L180 40 L290 40 L290 200 L240 260 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><line x1="180" y1="190" x2="240" y2="260" stroke="#15803d" stroke-width="5"/><text x="72" y="305" class="small">One side stays mostly flat; the other forms the main bevel</text></g><rect x="60" y="430" width="840" height="70" rx="12" fill="#fff" stroke="#d1d5db"/><text x="80" y="470" class="small">Profile, handedness and intended cutting technique matter more than the name alone.</text></svg>