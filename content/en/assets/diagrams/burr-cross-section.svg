<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">How a burr forms</title><desc id="desc">A two-step cross-section diagram showing the edge before apexing and the thin lip of steel that bends to the opposite side after the abrasive reaches the apex.</desc><style>text{font-family:Arial,sans-serif;fill:#222}.small{font-size:22px}.label{font-size:28px;font-weight:bold}.title{font-size:34px;font-weight:bold}</style><rect width="100%" height="100%" fill="#faf7f2"/><text x="40" y="50" class="title">How a burr forms during sharpening</text><text x="40" y="86" class="small">Simplified cross-section view of the edge apex</text><g transform="translate(90,140)"><text x="70" y="-20" class="label">1. Before the apex is reached</text><polygon points="120,220 220,20 320,220" fill="#cfd5dd" stroke="#6b7280" stroke-width="3"/><line x1="30" y1="120" x2="110" y2="160" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/><polygon points="30,120 58,116 43,139" fill="#ef4444"/><text x="0" y="105" class="small">Stone abrades this side</text><text x="150" y="255" class="small">No burr yet</text></g><g transform="translate(510,140)"><text x="80" y="-20" class="label">2. Steel folds to the opposite side</text><polygon points="120,220 220,20 320,220" fill="#cfd5dd" stroke="#6b7280" stroke-width="3"/><path d="M220 20 C246 24,260 42,258 64 C256 86,273 110,298 125" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/><line x1="30" y1="120" x2="110" y2="160" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/><polygon points="30,120 58,116 43,139" fill="#ef4444"/><text x="310" y="125" class="small">Burr</text><line x1="300" y1="130" x2="260" y2="92" stroke="#333" stroke-width="2"/><text x="148" y="255" class="small">A thin lip of steel bends over</text></g><rect x="40" y="450" width="880" height="56" rx="10" fill="#fff" stroke="#d1d5db"/><text x="60" y="485" class="small">The burr is not loose sludge: it remains attached until it is reduced or removed.</text></svg>