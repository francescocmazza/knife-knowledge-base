<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Preparing a water stone</title><desc id="desc">Three panels showing an absorbent stone soaking until bubbles slow, a splash-and-go stone receiving surface water and a stone kept wet during sharpening.</desc><style>text{font-family:Arial,sans-serif;fill:#222}.title{font-size:34px;font-weight:bold}.label{font-size:25px;font-weight:bold}.small{font-size:20px}</style><rect width="100%" height="100%" fill="#f7fbff"/><text x="40" y="52" class="title">Preparing a water stone: follow the stone, not a universal rule</text><g transform="translate(45,125)"><rect x="0" y="0" width="260" height="260" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><rect x="38" y="100" width="184" height="62" rx="8" fill="#d1d5db" stroke="#6b7280" stroke-width="3"/><circle cx="80" cy="78" r="9" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="132" cy="61" r="7" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="182" cy="84" r="10" fill="none" stroke="#2563eb" stroke-width="3"/><text x="28" y="205" class="label">Absorbent stone</text><text x="20" y="235" class="small">Soak until bubbling has</text><text x="20" y="260" class="small">substantially slowed</text></g><g transform="translate(350,125)"><rect x="0" y="0" width="260" height="260" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="38" y="125" width="184" height="62" rx="8" fill="#d1d5db" stroke="#6b7280" stroke-width="3"/><path d="M130 40 C105 75 106 94 130 110 C154 94 155 75 130 40Z" fill="#38bdf8"/><text x="34" y="225" class="label">Splash-and-go</text><text x="25" y="255" class="small">Surface water may be enough</text></g><g transform="translate(655,125)"><rect x="0" y="0" width="260" height="260" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="38" y="125" width="184" height="62" rx="8" fill="#d1d5db" stroke="#6b7280" stroke-width="3"/><path d="M40 120 Q130 95 220 120" fill="none" stroke="#38bdf8" stroke-width="8"/><path d="M65 75 L195 115" stroke="#475569" stroke-width="16" stroke-linecap="round"/><text x="45" y="225" class="label">During sharpening</text><text x="28" y="255" class="small">Keep the working surface wet</text></g><rect x="55" y="450" width="850" height="58" rx="10" fill="#fff" stroke="#d1d5db"/><text x="75" y="486" class="small">Manufacturer instructions prevail: prolonged soaking can damage some dense, ceramic or resin-bonded stones.</text></svg>