name: Export multilingual guide

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/export-multilingual.yml"
      - "scripts/publish_multilingual.ps1"
      - "publish-guide.cmd"
      - "PUBLISHING_GUIDE.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: multilingual-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-helper:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/publish_multilingual.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Confirm publishing documentation exists
        shell: bash
        run: |
          test -f publish-guide.cmd
          test -f PUBLISHING_GUIDE.md

  export:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .translation-cache
          key: multilingual-translations-v2-openai-${{ hashFiles('content/en/**/*.md', 'glossaries/**/*.yml', 'localization/locales.yml', 'scripts/multilingual_site.py') }}
          restore-keys: |
            multilingual-translations-v2-openai-

      - name: Translate and build every configured language
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python scripts/multilingual_site.py --translate --require-translations

      - name: Prepare export package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/html export/markdown
          cp -R site/. export/html/
          cp -R .site-work/docs/. export/markdown/
          cat > export/README.txt <<'EOF'
          Knife Knowledge Base multilingual export

          html/      Complete built website for every configured locale.
          markdown/  Generated per-locale source trees used to build the site.

          English remains the source of truth. Machine-generated translations may require human review.
          Image rights may differ from the written-content license; see the repository IMAGE_RIGHTS.md.
          EOF

      - name: Upload multilingual guide export
        uses: actions/upload-artifact@v4
        with:
          name: knife-knowledge-base-multilingual-${{ github.run_number }}
          path: export
          if-no-files-found: error
          retention-days: 30
