name: Refresh latest release after Pages deployment

on:
  workflow_run:
    workflows:
      - Deploy multilingual knowledge base to GitHub Pages
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: latest-knowledge-base-release
  cancel-in-progress: true

jobs:
  refresh-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the fully refreshed main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pdf.txt

      - name: Install documentation and PDF dependencies
        run: pip install -r requirements-pdf.txt

      - name: Install Playwright Chromium and CJK fonts
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-cjk-extra

      - name: Validate the multilingual source
        run: python scripts/multilingual_site.py --require-translations

      - name: Export current PDFs
        run: |
          python scripts/export_pdf_guides.py \
            --locales all \
            --placeholders hide \
            --output-dir release-assets/pdf

      - name: Package current downloadable editions
        run: |
          set -euo pipefail
          mkdir -p release-assets/packages/html release-assets/packages/markdown release-upload
          cp -R site/. release-assets/packages/html/
          cp -R .site-work/docs/. release-assets/packages/markdown/
          cp release-assets/pdf/*.pdf release-upload/
          (cd release-assets/packages/html && zip -qr ../../../release-upload/xinzuo-knowledge-base-latest-html.zip .)
          (cd release-assets/packages/markdown && zip -qr ../../../release-upload/xinzuo-knowledge-base-latest-markdown.zip .)
          (cd release-upload && sha256sum * > SHA256SUMS.txt)

      - name: Create or refresh the rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="latest"
          title="Xinzuo Knowledge Base — Latest Edition"
          source_sha="$(git rev-parse HEAD)"
          notes="Automatically rebuilt from main after the successful multilingual GitHub Pages deployment. Source commit: ${source_sha}."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" HEAD
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset_id; do
              gh api \
                --method DELETE \
                "repos/${REPOSITORY}/releases/assets/${asset_id}"
            done < <(
              gh api \
                "repos/${REPOSITORY}/releases/tags/${tag}" \
                --jq '.assets[] | select(.name | test("^Knife-Knowledge-Base-.*\\.pdf$")) | .id'
            )
            gh release upload "$tag" release-upload/* --clobber --repo "$REPOSITORY"
            gh release edit "$tag" \
              --repo "$REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "$title" \
              --notes "$notes" \
              --latest
          else
            gh release create "$tag" release-upload/* \
              --repo "$REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi
