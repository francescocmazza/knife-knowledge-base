name: Export PDF guides

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Language to export ('all' builds one PDF per configured language)"
        type: choice
        default: all
        options:
          - all
          - en
          - it
          - es
          - de
          - fr
          - ja
          - zh-Hans
          - zh-Hant
          - pt
          - pl
          - cs
          - nl
          - ar
          - he
      placeholders:
        description: "Editorial IMAGE PLACEHOLDER boxes in the printed guide"
        type: choice
        default: hide
        options:
          - hide
          - show
  pull_request:
    paths:
      - "content/en/**/*.md"
      - "content/en/assets/**"
      - "mkdocs.yml"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "scripts/publication_metadata.py"
      - "scripts/export_pdf_guides.py"
      - "scripts/pdf_export/**"
      - "requirements-pdf.txt"
      - ".github/workflows/export-pdf.yml"

permissions:
  contents: read

concurrency:
  group: export-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pdf.txt

      - name: Install documentation and PDF export dependencies
        run: pip install -r requirements-pdf.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install fonts for CJK, Arabic and Hebrew coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-cjk-extra

      - name: Restore translation cache
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: .translation-cache
          key: multilingual-translations-v2-openai-${{ hashFiles('content/en/**/*.md', 'glossaries/**/*.yml', 'localization/locales.yml', 'scripts/multilingual_site.py') }}
          restore-keys: |
            multilingual-translations-v2-openai-

      - name: Smoke-test the English PDF on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python scripts/export_pdf_guides.py \
            --locales en \
            --placeholders hide \
            --output-dir pdf-export

      - name: Require translation API key for non-English exports
        if: github.event_name == 'workflow_dispatch' && inputs.language != 'en'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY repository secret is required for translated PDF exports."
            exit 1
          fi

      - name: Export requested PDF guide(s)
        if: github.event_name == 'workflow_dispatch'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: |
          python scripts/export_pdf_guides.py \
            --locales ${{ inputs.language }} \
            --placeholders ${{ inputs.placeholders }} \
            --output-dir pdf-export

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: knife-knowledge-base-pdf-${{ github.run_number }}
          path: pdf-export
          if-no-files-found: error
          retention-days: 30
