name: One-time Actions artifact cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-artifact-cleanup.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all temporary workflow artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            let deleted = 0;
            let bytes = 0;
            for (const artifact of artifacts) {
              if (artifact.expired) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              deleted += 1;
              bytes += artifact.size_in_bytes;
            }

            core.summary
              .addHeading('One-time artifact cleanup')
              .addRaw(`Deleted ${deleted} artifacts (${(bytes / 1024 / 1024).toFixed(1)} MiB).`)
              .write();
