name: Deploy multilingual knowledge base to GitHub Pages

on:
  pull_request:
    paths:
      - "content/en/**"
      - "glossaries/**"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "content/en/**"
      - "glossaries/**"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  models: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Restore translation cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: .translation-cache
          key: multilingual-translations-v1-${{ hashFiles('content/en/**/*.md', 'glossaries/**/*.yml', 'localization/locales.yml', 'scripts/multilingual_site.py') }}
          restore-keys: |
            multilingual-translations-v1-

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Validate English site on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/multilingual_site.py --locales en

      - name: Validate GitHub Models access on pull requests
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4.1
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "model": os.environ["GITHUB_MODELS_MODEL"],
              "temperature": 0,
              "max_tokens": 16,
              "messages": [{"role": "user", "content": "Reply with exactly: OK"}],
          }
          request = urllib.request.Request(
              "https://models.github.ai/inference/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2026-03-10",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.loads(response.read().decode("utf-8"))
          content = data["choices"][0]["message"]["content"].strip()
          if "OK" not in content.upper():
              raise SystemExit(f"Unexpected GitHub Models response: {content!r}")
          print(f"GitHub Models probe succeeded with {os.environ['GITHUB_MODELS_MODEL']}")
          PY

      - name: Translate and build every configured language
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4.1
        run: python scripts/multilingual_site.py --translate

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
