name: Deploy multilingual knowledge base to GitHub Pages

on:
  pull_request:
    paths:
      - "content/en/**"
      - "translations/**"
      - "glossaries/**"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "content/en/**"
      - "translations/**"
      - "glossaries/**"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Validate complete multilingual source on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/multilingual_site.py --require-translations

      - name: Build every configured language from committed translations
        if: github.event_name != 'pull_request'
        run: python scripts/multilingual_site.py --require-translations

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
