name: Deploy multilingual knowledge base to GitHub Pages

on:
  pull_request:
    paths:
      - "content/en/**"
      - "glossaries/**"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "content/en/**"
      - "glossaries/**"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Restore translation cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: .translation-cache
          key: multilingual-translations-v2-openai-${{ hashFiles('content/en/**/*.md', 'glossaries/**/*.yml', 'localization/locales.yml', 'scripts/multilingual_site.py') }}
          restore-keys: |
            multilingual-translations-v2-openai-

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Validate English site on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/multilingual_site.py --locales en

      - name: Validate OpenAI translation provider on pull requests
        if: github.event_name == 'pull_request'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is not configured. Add it before merging this migration."
            exit 1
          fi
          python - <<'PY'
          import os
          from scripts.multilingual_site import call_model

          source = "A sharp kitchen knife cuts cleanly."
          translated = call_model(
              source,
              "it",
              "Italian",
              "",
              os.environ["OPENAI_API_KEY"],
              os.environ["OPENAI_MODEL"],
          ).strip()
          if not translated or translated == source:
              raise SystemExit(f"Unexpected translation probe result: {translated!r}")
          print("OpenAI translation provider probe succeeded.")
          PY

      - name: Translate and build every configured language
        if: github.event_name != 'pull_request'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python scripts/multilingual_site.py --translate --require-translations

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
